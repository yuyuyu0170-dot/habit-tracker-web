<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>習慣トラッカー</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-900: #0017C1;
  --blue-500: #3460FB;
  --blue-300: #7096F8;
  --blue-100: #C5D7FB;
  --blue-050: #E8F1FE;
  --green-700: #1A8A5C;
  --green-500: #2AB27B;
  --green-100: #C5E8D8;
  --green-050: #EEF8F4;
  --orange: #E87A00;
  --bg:     #FFFFFF;
  --s1:     #F8F8FB;
  --s2:     #EEF0F8;
  --border: #D8DCF0;
  --t1: #000000;
  --t2: #5F6B7A;
  --t3: #9AA3B0;
  --r: 10px;
  --side-w: 280px;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: Arial, 'Helvetica Neue', sans-serif;
  background: var(--blue-050);
  color: var(--t1);
}

/* #app はズームのターゲット。サイズはJSで設定 */
#app {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ズームボタンオーバーレイ: #app の外にあるため zoom の影響を受けない */
#zoom-overlay {
  position: fixed;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 9999;
  visibility: hidden; /* positionOverlay() が完了するまで非表示 */
}

/* ══════════════════════════════
   TOP BAR
══════════════════════════════ */
.top-bar {
  flex-shrink: 0;
  background: var(--blue-500);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 18px;
}

.header { flex-shrink: 0; }
.header h1 { font-size: 0.95rem; font-weight: 700; color: #fff; }
.header p  { font-size: 0.65rem; color: rgba(255,255,255,0.65); margin-top: 1px; }

.stat-chips { display: flex; gap: 8px; flex: 1; }
.chip {
  display: flex; align-items: center; gap: 6px;
  background: #fff; border-radius: 20px; padding: 4px 12px;
}
.chip-num { font-size: 1rem; font-weight: 700; line-height: 1; }
.chip-num.orange { color: var(--orange); }
.chip-num.blue   { color: var(--blue-500); }
.chip-num.green  { color: var(--green-500); }
.chip-lbl { font-size: 0.62rem; color: var(--t2); white-space: nowrap; }

.month-nav { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.nav-btn {
  width: 26px; height: 26px; border-radius: 6px;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  color: #fff; font-size: 0.9rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.3); }
.month-label { font-size: 0.82rem; font-weight: 700; color: #fff; white-space: nowrap; }

/* Zoom */
.zoom-btn {
  width: 22px; height: 22px; border-radius: 5px;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  color: #fff; font-size: 0.9rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.zoom-btn:hover { background: rgba(255,255,255,0.3); }
.zoom-lbl {
  font-size: 0.62rem; color: rgba(255,255,255,0.75);
  width: 32px; text-align: center; font-weight: 700;
}

.toggle-side {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.8); font-size: 0.75rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.toggle-side:hover { background: rgba(255,255,255,0.3); color: #fff; }

/* ══════════════════════════════
   BODY AREA
══════════════════════════════ */
.body-area { flex: 1; display: flex; overflow: hidden; }

.main-panel {
  flex: 1; min-width: 0; overflow: hidden;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
}

.today {
  background: var(--bg); border: 1.5px solid var(--blue-100);
  border-radius: var(--r); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px;
  flex: 1; min-height: 0; overflow: hidden;
}
.today-head { display: flex; justify-content: space-between; align-items: center; }
.today-date { font-size: 0.9rem; font-weight: 700; color: var(--blue-900); }
.today-pct  { font-size: 0.75rem; color: var(--t2); }

.prog-track { height: 5px; background: var(--blue-050); border-radius: 99px; overflow: hidden; }
.prog-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--blue-300), var(--blue-500));
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
}
.prog-fill.full { background: linear-gradient(90deg, var(--green-500), var(--green-700)); }

.habits { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; overflow-y: auto; }
.habit {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 7px;
  background: var(--s1); border: 1px solid var(--border);
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  user-select: none;
}
.habit:hover { background: var(--blue-050); border-color: var(--blue-100); }
.habit.done  { background: var(--green-050); border-color: var(--green-100); }
.chk {
  width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: #fff; transition: all 0.15s;
}
.habit:not(.done) .chk { border-color: var(--blue-200, #9BBCFD); }
.habit.done .chk { background: var(--green-500); border-color: var(--green-500); }
.hname { font-size: 0.84rem; }
.habit.done .hname { color: var(--green-700); font-weight: 500; }

.ebar {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 0.9rem; letter-spacing: 1px;
}
.eval {
  font-size: 0.67rem; font-weight: 700; color: var(--blue-500);
  background: var(--blue-050); border: 1px solid var(--blue-100);
  border-radius: 20px; padding: 2px 10px;
}

.settings-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 14px; flex-shrink: 0;
}
.stg-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-size: 0.8rem; font-weight: 700; user-select: none;
  color: var(--blue-500);
}
.stg-toggle:hover { color: var(--blue-900); }
.arrow { color: var(--blue-300); transition: transform 0.2s; display: inline-block; }
.arrow.open { transform: rotate(90deg); }
.stg-body { display: none; flex-direction: column; gap: 7px; margin-top: 10px; }
.stg-body.open { display: flex; }
.irow { display: flex; align-items: center; gap: 8px; }
.ilbl { font-size: 0.68rem; color: var(--t3); width: 14px; text-align: right; flex-shrink: 0; }
.hinput {
  flex: 1; background: var(--s1); border: 1px solid var(--border);
  border-radius: 6px; color: var(--t1); padding: 6px 10px;
  font-size: 0.82rem; font-family: Arial, sans-serif;
  outline: none; transition: border-color 0.15s;
}
.hinput:focus { border-color: var(--blue-500); background: var(--blue-050); }
.sbtn {
  width: 100%; background: var(--blue-500);
  border: none; color: #fff; padding: 9px; border-radius: 7px;
  font-size: 0.82rem; font-weight: 700; font-family: Arial, sans-serif;
  cursor: pointer; transition: background 0.15s;
}
.sbtn:hover { background: var(--blue-900); }

.side-panel {
  width: var(--side-w); flex-shrink: 0;
  overflow-y: auto; overflow-x: hidden;
  background: var(--bg); border-left: 2px solid var(--blue-100);
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 12px;
  transition: width 0.25s ease, padding 0.25s ease, border 0.25s ease;
}
.side-panel.closed { width: 0; padding: 0; border-left: none; overflow: hidden; }

.card { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.card-title {
  font-size: 0.63rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--blue-500); margin-bottom: 10px;
}

.hmap { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.cell { aspect-ratio: 1; border-radius: 3px; cursor: default; transition: transform 0.1s; }
.cell:hover { transform: scale(1.4); z-index: 1; position: relative; }
.h0 { background: var(--s2); }
.h1 { background: var(--blue-050); }
.h2 { background: var(--blue-100); }
.h3 { background: var(--blue-300); }
.h4 { background: var(--blue-500); }
.h5 { background: var(--blue-900); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-wd { font-size: 0.58rem; color: var(--t3); text-align: center; padding-bottom: 3px; font-weight: 700; }
.cal-d {
  aspect-ratio: 1; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.58rem; font-weight: 600;
}
.cal-d.future { background: var(--s2); color: var(--t3); }
.cal-d.today-mark { outline: 2px solid var(--blue-500); outline-offset: 1px; }
.d0 { background: var(--s2); color: var(--t3); }
.d1 { background: var(--blue-050); color: var(--blue-900); }
.d2 { background: var(--blue-100); color: var(--blue-900); }
.d3 { background: var(--blue-300); color: #fff; }
.d4 { background: var(--blue-500); color: #fff; }
.d5 { background: var(--blue-900); color: #fff; }

.date-list { display: flex; flex-direction: column; gap: 2px; }
.date-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border-radius: 5px; font-size: 0.68rem;
}
.date-row:hover { background: var(--blue-050); }
.date-row.is-today { background: var(--blue-050); border: 1px solid var(--blue-100); }
.dr-date { color: var(--t2); width: 64px; flex-shrink: 0; font-size: 0.65rem; }
.dr-dots { flex: 1; letter-spacing: 0.5px; font-size: 0.72rem; }
.dr-pct { width: 32px; text-align: right; font-weight: 700; font-size: 0.65rem; flex-shrink: 0; }
.pct-100 { color: var(--blue-900); }
.pct-hi  { color: var(--blue-500); }
.pct-mid { color: var(--blue-300); }
.pct-lo  { color: var(--t3); }
</style>
</head>
<body>

<!-- #app: zoom の対象。ズームボタンはこの外に置く -->
<div id="app">

<div class="top-bar">
  <div class="header">
    <h1>習慣トラッカー</h1>
    <p>毎日の記録を積み上げよう</p>
  </div>

  <div class="stat-chips">
    <div class="chip">
      <span class="chip-num orange" id="s-streak">0</span>
      <span class="chip-lbl">連続日数</span>
    </div>
    <div class="chip">
      <span class="chip-num blue" id="s-best">0</span>
      <span class="chip-lbl">最長記録</span>
    </div>
    <div class="chip" id="chip-rate">
      <span class="chip-num green" id="s-rate">—</span>
      <span class="chip-lbl">今月達成率</span>
    </div>
  </div>

  <div class="month-nav">
    <button class="nav-btn" id="prev">‹</button>
    <span class="month-label" id="month-lbl"></span>
    <button class="nav-btn" id="next">›</button>
  </div>

  <button class="toggle-side" id="toggle-side" title="履歴パネルを開閉">▶</button>
</div>

<div class="body-area">
  <div class="main-panel">
    <div class="today">
      <div class="today-head">
        <span class="today-date" id="today-lbl"></span>
        <span class="today-pct" id="today-pct"></span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog" style="width:0"></div></div>
      <div class="habits" id="habits"></div>
      <div class="ebar" id="ebar"></div>
    </div>

    <div class="settings-card">
      <div class="stg-toggle" id="stg-toggle">
        <span>習慣を編集する</span>
        <span class="arrow" id="stg-arrow">›</span>
      </div>
      <div class="stg-body" id="stg-body">
        <div id="stg-inputs"></div>
        <button class="sbtn" id="stg-save">保存する</button>
      </div>
    </div>
  </div>

  <div class="side-panel" id="side-panel">
    <div class="card">
      <div class="card-title">直近 15 週</div>
      <div class="hmap" id="hmap"></div>
    </div>
    <div class="card">
      <div class="card-title" id="cal-title">月間カレンダー</div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">日付ごとの記録</div>
      <div class="date-list" id="date-list"></div>
    </div>
  </div>
</div>

</div><!-- /#app -->

<!-- zoom overlay: #app の外 → zoom の影響を受けない → クリックしても位置が動かない -->
<div id="zoom-overlay">
  <button class="zoom-btn" id="zoom-out">−</button>
  <span class="zoom-lbl" id="zoom-lbl">100%</span>
  <button class="zoom-btn" id="zoom-in">＋</button>
</div>

<script>
const KEY = 'habit-v2';
const WD  = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const dk  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { return fresh(); }
}
function fresh() {
  return { habits:['習慣 1','習慣 2','習慣 3','習慣 4','習慣 5'], records:{}, streakBest:0 };
}
function save() { localStorage.setItem(KEY, JSON.stringify(st)); }

let st = load();
let vm = { y: new Date().getFullYear(), m: new Date().getMonth() };

function rec(k) { const r = st.records[k]; return Array.isArray(r) ? r : st.habits.map(()=>false); }
function rate(k) { const r=rec(k), n=st.habits.length; return n ? Math.round(r.filter(Boolean).length/n*100) : 0; }
function heatCls(r, pre='h') { return r===0?`${pre}0`:r<=20?`${pre}1`:r<=40?`${pre}2`:r<=60?`${pre}3`:r<=80?`${pre}4`:`${pre}5`; }

function calcStreak() {
  let s=0; const now=new Date();
  for(let i=0;i<400;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    if(rate(dk(d))===100) s++; else if(i>0) break;
  }
  st.streakBest=Math.max(st.streakBest||0,s); return s;
}
function monthRate(y,m) {
  const now=new Date(), isThis=(y===now.getFullYear()&&m===now.getMonth());
  const last=isThis?now.getDate():new Date(y,m+1,0).getDate();
  let sum=0;
  for(let d=1;d<=last;d++) sum+=rate(`${y}-${pad(m+1)}-${pad(d)}`);
  return Math.round(sum/last);
}

function renderToday() {
  const tk=dk(new Date()), now=new Date();
  document.getElementById('today-lbl').textContent=`${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
  const r=rec(tk), done=r.filter(Boolean).length, tot=st.habits.length;
  const pct=tot?Math.round(done/tot*100):0;
  document.getElementById('today-pct').textContent=`${done} / ${tot}`;
  const fill=document.getElementById('prog');
  fill.style.width=pct+'%';
  fill.className='prog-fill'+(pct===100?' full':'');

  const list=document.getElementById('habits'); list.innerHTML='';
  st.habits.forEach((name,i)=>{
    const el=document.createElement('div');
    el.className='habit'+(r[i]?' done':'');
    el.innerHTML=`<div class="chk">${r[i]?'✓':''}</div><div class="hname">${name}</div>`;
    el.onclick=()=>{ const rr=rec(tk).slice(); rr[i]=!rr[i]; st.records[tk]=rr; save(); renderAll(); };
    list.appendChild(el);
  });

  const emojis=r.map(v=>v?'🟦':'⬜').join('');
  const label=pct===100?'完璧':pct>=80?'良い':pct>=60?'まずまず':pct>=40?'もう少し':'頑張ろう';
  document.getElementById('ebar').innerHTML=`<span>${emojis}</span><span class="eval">${label}</span>`;
}

function renderStats() {
  const streak=calcStreak();
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('s-best').textContent=st.streakBest;
  document.getElementById('s-rate').textContent=monthRate(vm.y,vm.m)+'%';
}

function renderNav() {
  document.getElementById('month-lbl').textContent=`${vm.y}年 ${vm.m+1}月`;
}

function renderHmap() {
  const grid=document.getElementById('hmap'); grid.innerHTML='';
  const now=new Date();
  for(let i=104;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const cell=document.createElement('div');
    cell.className='cell '+heatCls(rate(dk(d)));
    cell.title=`${d.getMonth()+1}/${d.getDate()} ${rate(dk(d))}%`;
    grid.appendChild(cell);
  }
}

function renderCal() {
  document.getElementById('cal-title').textContent=`${vm.y}年${vm.m+1}月`;
  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  WD.forEach(w=>{ const h=document.createElement('div'); h.className='cal-wd'; h.textContent=w; grid.appendChild(h); });
  const first=new Date(vm.y,vm.m,1).getDay(), days=new Date(vm.y,vm.m+1,0).getDate();
  const now=new Date(), isThis=vm.y===now.getFullYear()&&vm.m===now.getMonth();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-d empty'; grid.appendChild(e); }
  for(let d=1;d<=days;d++){
    const k=`${vm.y}-${pad(vm.m+1)}-${pad(d)}`;
    const el=document.createElement('div'); el.textContent=d;
    const isFut=isThis&&d>now.getDate(), isTod=isThis&&d===now.getDate();
    el.className='cal-d '+(isFut?'future':heatCls(rate(k),'d'));
    if(isTod) el.classList.add('today-mark');
    grid.appendChild(el);
  }
}

function renderDateList() {
  const list=document.getElementById('date-list'); list.innerHTML='';
  const now=new Date(), todayKey=dk(now);
  for(let i=0;i<90;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dk(d), pct=rate(k);
    const r=rec(k);
    const dots=r.map(v=>v?'🟦':'⬜').join('');
    const dateStr=`${d.getMonth()+1}/${d.getDate()} ${WD[d.getDay()]}`;
    const pctCls=pct===100?'pct-100':pct>=80?'pct-hi':pct>=40?'pct-mid':'pct-lo';
    const row=document.createElement('div');
    row.className='date-row'+(k===todayKey?' is-today':'');
    row.innerHTML=`<span class="dr-date">${dateStr}</span><span class="dr-dots">${dots}</span><span class="dr-pct ${pctCls}">${pct}%</span>`;
    list.appendChild(row);
  }
}

function renderSettings() {
  const box=document.getElementById('stg-inputs'); box.innerHTML='';
  st.habits.forEach((name,i)=>{
    const row=document.createElement('div'); row.className='irow';
    row.innerHTML=`<span class="ilbl">${i+1}</span><input class="hinput" data-i="${i}" value="${name}" placeholder="習慣 ${i+1}">`;
    box.appendChild(row);
  });
}

// ══════════════════════
// Zoom
// ══════════════════════
const ZOOM_STEP=5, ZOOM_MIN=50, ZOOM_MAX=150;
// コンテンツが 100% zoom で快適に見えるビューポートの基準サイズ
const REF_W=900, REF_H=500;
let zoomPct=100;
let manualOverride=false;

const appEl    = document.getElementById('app');
const overlayEl = document.getElementById('zoom-overlay');

// zoom-overlay を 今月達成率チップの右隣に配置する
// getBoundingClientRect() は zoom 後の視覚的なビューポート座標を返すので
// position: fixed の配置にそのまま使える
function positionOverlay() {
  const chip = document.getElementById('chip-rate');
  const rect = chip.getBoundingClientRect();
  overlayEl.style.left   = (rect.right + 8) + 'px';
  overlayEl.style.top    = rect.top + 'px';
  overlayEl.style.height = rect.height + 'px';
  overlayEl.style.visibility = 'visible';
}

function applyZoom() {
  const z = zoomPct / 100;
  // zoom を #app に適用（html ではない）
  // vw/vh は zoom の影響を受けないので (100/z)vw × z = 100vw でちょうどビューポートを埋める
  appEl.style.zoom   = z;
  appEl.style.width  = `${100/z}vw`;
  appEl.style.height = `${100/z}vh`;
  document.getElementById('zoom-lbl').textContent = zoomPct + '%';
  // RAF でレイアウト確定後に overlay を再配置
  requestAnimationFrame(positionOverlay);
}

function autoFit() {
  const scale = Math.min(window.innerWidth / REF_W, window.innerHeight / REF_H, 1.5);
  // 1% 単位で丸める（5% 丸めより精度が上がり余白が減る）
  zoomPct = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, scale * 100)));
  applyZoom();
}

document.getElementById('zoom-in').onclick = () => {
  manualOverride = true;
  zoomPct = Math.min(ZOOM_MAX, Math.ceil(zoomPct / ZOOM_STEP) * ZOOM_STEP + ZOOM_STEP);
  applyZoom();
};
document.getElementById('zoom-out').onclick = () => {
  manualOverride = true;
  zoomPct = Math.max(ZOOM_MIN, Math.floor(zoomPct / ZOOM_STEP) * ZOOM_STEP - ZOOM_STEP);
  applyZoom();
};

let _rzTimer;
window.addEventListener('resize', () => {
  if(manualOverride) return;
  clearTimeout(_rzTimer);
  _rzTimer = setTimeout(autoFit, 150);
});

// Side panel
const sidePanel=document.getElementById('side-panel');
const toggleBtn=document.getElementById('toggle-side');
let sideOpen=true;
toggleBtn.onclick=()=>{
  sideOpen=!sideOpen;
  sidePanel.classList.toggle('closed',!sideOpen);
  toggleBtn.textContent=sideOpen?'▶':'◀';
  // パネル幅が変わるので overlay の位置を更新
  requestAnimationFrame(positionOverlay);
};

document.getElementById('stg-toggle').onclick=()=>{
  const b=document.getElementById('stg-body'), a=document.getElementById('stg-arrow');
  const open=b.classList.toggle('open'); a.classList.toggle('open',open);
};
document.getElementById('stg-save').onclick=()=>{
  st.habits=[...document.querySelectorAll('#stg-inputs .hinput')].map((inp,i)=>inp.value.trim()||`習慣 ${i+1}`);
  save(); renderAll();
  document.getElementById('stg-body').classList.remove('open');
  document.getElementById('stg-arrow').classList.remove('open');
};

document.getElementById('prev').onclick=()=>{ if(vm.m===0){vm.y--;vm.m=11;}else vm.m--; renderNav();renderStats();renderCal(); };
document.getElementById('next').onclick=()=>{ if(vm.m===11){vm.y++;vm.m=0;}else vm.m++; renderNav();renderStats();renderCal(); };

function renderAll() { renderToday();renderStats();renderNav();renderHmap();renderCal();renderDateList();renderSettings(); }
renderAll();
autoFit(); // 初期表示時に自動フィット
</script>
</body>
</html>
