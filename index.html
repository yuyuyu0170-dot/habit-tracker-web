<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>習慣トラッカー</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* デジタル庁 Blue パレット */
  --blue-900: #0017C1;
  --blue-500: #3460FB;
  --blue-300: #7096F8;
  --blue-100: #C5D7FB;
  --blue-050: #E8F1FE;

  /* Green（達成・成功） */
  --green-700: #1A8A5C;
  --green-500: #2AB27B;
  --green-100: #C5E8D8;
  --green-050: #EEF8F4;

  /* Orange（ストリーク） */
  --orange:    #E87A00;
  --orange-bg: #FEF3E0;

  /* Surface */
  --bg:     #FFFFFF;
  --s1:     #F8F8FB;
  --s2:     #EEF0F8;
  --border: #D8DCF0;

  /* Text */
  --t1: #000000;
  --t2: #5F6B7A;
  --t3: #9AA3B0;

  --r: 12px;
}

body {
  font-family: Arial, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  padding: 24px 16px 56px;
}

.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 10px; border-bottom: 1px solid var(--border); }
.main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.side-panel { display: flex; flex-direction: column; gap: 14px; }

/* ─── Header ─── */
.header h1 { font-size: 1.1rem; font-weight: 700; color: var(--t1); }
.header p  { font-size: 0.75rem; color: var(--t2); margin-top: 3px; }

/* ─── Month nav ─── */
.month-nav {
  display: flex; align-items: center; gap: 12px;
}
.nav-btn {
  width: 30px; height: 30px; border-radius: 6px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--t1); font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.nav-btn:hover { background: var(--s2); }
.month-label { font-size: 0.95rem; font-weight: 700; }

/* ─── Stat row ─── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 10px; text-align: center;
}
.stat-num {
  font-size: 2rem; font-weight: 700; line-height: 1;
  display: block; margin-bottom: 6px;
}
.stat-num.orange { color: var(--orange); }
.stat-num.blue   { color: var(--blue-500); }
.stat-num.green  { color: var(--green-500); }
.stat-lbl { font-size: 0.68rem; color: var(--t2); font-weight: 400; }

/* ─── Today card ─── */
.today {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px;
  display: flex; flex-direction: column; gap: 13px;
}
.today-head { display: flex; justify-content: space-between; align-items: baseline; }
.today-date { font-size: 0.95rem; font-weight: 700; }
.today-pct  { font-size: 0.8rem; color: var(--t2); }

/* Progress bar */
.prog-track { height: 4px; background: var(--s2); border-radius: 99px; overflow: hidden; }
.prog-fill  {
  height: 100%; border-radius: 99px; background: var(--blue-500);
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
}
.prog-fill.full { background: var(--green-500); }

/* Habit list */
.habits { display: flex; flex-direction: column; gap: 8px; }
.habit {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  cursor: pointer; transition: border-color 0.15s, background 0.15s; user-select: none;
}
.habit:hover { background: var(--s2); }
.habit.done  { background: var(--green-050); border-color: var(--green-100); }

.chk {
  width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0;
  border: 1.5px solid var(--border); display: flex;
  align-items: center; justify-content: center;
  font-size: 0.75rem; color: #fff; transition: all 0.15s;
}
.habit.done .chk { background: var(--green-500); border-color: var(--green-500); }

.hname { font-size: 0.9rem; font-weight: 400; }
.habit.done .hname { color: var(--green-700); font-weight: 500; }

/* Emoji bar */
.ebar {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 1rem; letter-spacing: 1px;
}
.eval {
  font-size: 0.72rem; font-weight: 600; color: var(--blue-500);
  background: var(--blue-050); border-radius: 4px; padding: 3px 10px;
}

/* ─── Cards ─── */
.heatmap-card, .cal-card, .settings-card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px;
}
.card-title {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--t2); margin-bottom: 13px;
}

/* ─── Heatmap ─── */
.hmap { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
.cell {
  aspect-ratio: 1; border-radius: 3px;
  transition: transform 0.12s; cursor: default;
}
.cell:hover { transform: scale(1.4); z-index: 1; position: relative; }
.h0 { background: var(--s2); }
.h1 { background: var(--green-050); }
.h2 { background: var(--green-100); }
.h3 { background: #7BCFAB; }
.h4 { background: var(--green-500); }
.h5 { background: var(--green-700); }

/* ─── Calendar ─── */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd {
  font-size: 0.63rem; color: var(--t3); text-align: center;
  padding-bottom: 5px; font-weight: 700;
}
.cal-d {
  aspect-ratio: 1; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.63rem; font-weight: 600;
}
.cal-d.empty  { }
.cal-d.future { background: var(--s2); color: var(--t3); }
.cal-d.today-mark { outline: 2px solid var(--blue-500); outline-offset: 1px; }
.d0 { background: var(--s2); color: var(--t3); }
.d1 { background: var(--green-050); color: var(--green-700); }
.d2 { background: var(--green-100); color: var(--green-700); }
.d3 { background: #7BCFAB; color: #fff; }
.d4 { background: var(--green-500); color: #fff; }
.d5 { background: var(--green-700); color: #fff; }

/* ─── Settings ─── */
.stg-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-size: 0.88rem; font-weight: 700; user-select: none;
}
.stg-toggle:hover { color: var(--blue-500); }
.arrow { color: var(--t2); transition: transform 0.2s; display: inline-block; }
.arrow.open { transform: rotate(90deg); }
.stg-body { display: none; flex-direction: column; gap: 9px; margin-top: 14px; }
.stg-body.open { display: flex; }
.irow { display: flex; align-items: center; gap: 10px; }
.ilbl { font-size: 0.72rem; color: var(--t3); width: 14px; text-align: right; flex-shrink: 0; }
.hinput {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--t1); padding: 8px 11px;
  font-size: 0.87rem; font-family: Arial, sans-serif;
  outline: none; transition: border-color 0.15s;
}
.hinput:focus { border-color: var(--blue-500); }
.sbtn {
  margin-top: 4px; width: 100%; background: var(--blue-500);
  border: none; color: #fff; padding: 11px; border-radius: 8px;
  font-size: 0.88rem; font-weight: 700; font-family: Arial, sans-serif;
  cursor: pointer; transition: background 0.15s;
}
.sbtn:hover { background: var(--blue-900); }

/* ─── Footer ─── */
.note { text-align: center; font-size: 0.68rem; color: var(--t3); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="header">
      <h1>習慣トラッカー</h1>
      <p>毎日の記録を積み上げよう</p>
    </div>
    <div class="month-nav">
      <button class="nav-btn" id="prev">‹</button>
      <span class="month-label" id="month-lbl"></span>
      <button class="nav-btn" id="next">›</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-num orange" id="s-streak">0</span>
      <div class="stat-lbl">連続日数</div>
    </div>
    <div class="stat">
      <span class="stat-num blue" id="s-best">0</span>
      <div class="stat-lbl">最長記録</div>
    </div>
    <div class="stat">
      <span class="stat-num green" id="s-rate">—</span>
      <div class="stat-lbl">今月達成率</div>
    </div>
  </div>

  <div class="main-grid">
    <div class="today">
      <div class="today-head">
        <span class="today-date" id="today-lbl"></span>
        <span class="today-pct" id="today-pct"></span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog" style="width:0"></div></div>
      <div class="habits" id="habits"></div>
      <div class="ebar" id="ebar"></div>
    </div>

    <div class="side-panel">
      <div class="heatmap-card">
        <div class="card-title">直近 15 週</div>
        <div class="hmap" id="hmap"></div>
      </div>

      <div class="cal-card">
        <div class="card-title" id="cal-title">月間カレンダー</div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </div>

  <div class="settings-card">
    <div class="stg-toggle" id="stg-toggle">
      <span>習慣を編集する</span>
      <span class="arrow" id="stg-arrow">›</span>
    </div>
    <div class="stg-body" id="stg-body">
      <div id="stg-inputs"></div>
      <button class="sbtn" id="stg-save">保存する</button>
    </div>
  </div>

  <div class="note">データはブラウザ（localStorage）に保存されます</div>
</div>

<script>
const KEY = 'habit-v2';
const WD  = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const dk  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { return fresh(); }
}
function fresh() {
  return { habits:['習慣 1','習慣 2','習慣 3','習慣 4','習慣 5'], records:{}, streakBest:0 };
}
function save() { localStorage.setItem(KEY, JSON.stringify(st)); }

let st = load();
let vm = { y: new Date().getFullYear(), m: new Date().getMonth() };

function rec(k) { const r = st.records[k]; return Array.isArray(r) ? r : st.habits.map(()=>false); }
function rate(k) { const r=rec(k), n=st.habits.length; return n ? Math.round(r.filter(Boolean).length/n*100) : 0; }
function heatCls(r, pre='h') { return r===0?`${pre}0`:r<=20?`${pre}1`:r<=40?`${pre}2`:r<=60?`${pre}3`:r<=80?`${pre}4`:`${pre}5`; }

function calcStreak() {
  let s=0; const now=new Date();
  for(let i=0;i<400;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    if(rate(dk(d))===100) s++; else if(i>0) break;
  }
  st.streakBest=Math.max(st.streakBest||0,s); return s;
}
function monthRate(y,m) {
  const now=new Date(), isThis=(y===now.getFullYear()&&m===now.getMonth());
  const last=isThis?now.getDate():new Date(y,m+1,0).getDate();
  let sum=0;
  for(let d=1;d<=last;d++) sum+=rate(`${y}-${pad(m+1)}-${pad(d)}`);
  return Math.round(sum/last);
}

function renderToday() {
  const tk=dk(new Date()), now=new Date();
  document.getElementById('today-lbl').textContent=`${now.getMonth()+1}月${now.getDate()}日（${WD[now.getDay()]}）`;
  const r=rec(tk), done=r.filter(Boolean).length, tot=st.habits.length;
  const pct=tot?Math.round(done/tot*100):0;
  document.getElementById('today-pct').textContent=`${done} / ${tot}`;
  const fill=document.getElementById('prog');
  fill.style.width=pct+'%';
  fill.className='prog-fill'+(pct===100?' full':'');

  const list=document.getElementById('habits'); list.innerHTML='';
  st.habits.forEach((name,i)=>{
    const el=document.createElement('div');
    el.className='habit'+(r[i]?' done':'');
    el.innerHTML=`<div class="chk">${r[i]?'✓':''}</div><div class="hname">${name}</div>`;
    el.onclick=()=>{ const rr=rec(tk).slice(); rr[i]=!rr[i]; st.records[tk]=rr; save(); renderAll(); };
    list.appendChild(el);
  });

  const emojis=r.map(v=>v?'🟩':'⬜').join('');
  const label=pct===100?'完璧':pct>=80?'良い':pct>=60?'まずまず':pct>=40?'もう少し':'頑張ろう';
  document.getElementById('ebar').innerHTML=`<span>${emojis}</span><span class="eval">${label}</span>`;
}

function renderStats() {
  const streak=calcStreak();
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('s-best').textContent=st.streakBest;
  document.getElementById('s-rate').textContent=monthRate(vm.y,vm.m)+'%';
}

function renderNav() {
  document.getElementById('month-lbl').textContent=`${vm.y}年 ${vm.m+1}月`;
}

function renderHmap() {
  const grid=document.getElementById('hmap'); grid.innerHTML='';
  const now=new Date();
  for(let i=104;i>=0;i--){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const cell=document.createElement('div');
    cell.className='cell '+heatCls(rate(dk(d)));
    cell.title=`${d.getMonth()+1}/${d.getDate()} ${rate(dk(d))}%`;
    grid.appendChild(cell);
  }
}

function renderCal() {
  document.getElementById('cal-title').textContent=`${vm.y}年${vm.m+1}月`;
  const grid=document.getElementById('cal-grid'); grid.innerHTML='';
  WD.forEach(w=>{ const h=document.createElement('div'); h.className='cal-wd'; h.textContent=w; grid.appendChild(h); });
  const first=new Date(vm.y,vm.m,1).getDay(), days=new Date(vm.y,vm.m+1,0).getDate();
  const now=new Date(), isThis=vm.y===now.getFullYear()&&vm.m===now.getMonth();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-d empty'; grid.appendChild(e); }
  for(let d=1;d<=days;d++){
    const k=`${vm.y}-${pad(vm.m+1)}-${pad(d)}`;
    const el=document.createElement('div'); el.textContent=d;
    const isFut=isThis&&d>now.getDate(), isTod=isThis&&d===now.getDate();
    el.className='cal-d '+(isFut?'future':heatCls(rate(k),'d'));
    if(isTod) el.classList.add('today-mark');
    grid.appendChild(el);
  }
}

function renderSettings() {
  const box=document.getElementById('stg-inputs'); box.innerHTML='';
  st.habits.forEach((name,i)=>{
    const row=document.createElement('div'); row.className='irow';
    row.innerHTML=`<span class="ilbl">${i+1}</span><input class="hinput" data-i="${i}" value="${name}" placeholder="習慣 ${i+1}">`;
    box.appendChild(row);
  });
}

document.getElementById('stg-toggle').onclick=()=>{
  const b=document.getElementById('stg-body'), a=document.getElementById('stg-arrow');
  const open=b.classList.toggle('open'); a.classList.toggle('open',open);
};
document.getElementById('stg-save').onclick=()=>{
  st.habits=[...document.querySelectorAll('#stg-inputs .hinput')].map((inp,i)=>inp.value.trim()||`習慣 ${i+1}`);
  save(); renderAll();
  document.getElementById('stg-body').classList.remove('open');
  document.getElementById('stg-arrow').classList.remove('open');
};

document.getElementById('prev').onclick=()=>{ if(vm.m===0){vm.y--;vm.m=11;}else vm.m--; renderNav();renderStats();renderCal(); };
document.getElementById('next').onclick=()=>{ if(vm.m===11){vm.y++;vm.m=0;}else vm.m++; renderNav();renderStats();renderCal(); };

function renderAll() { renderToday();renderStats();renderNav();renderHmap();renderCal();renderSettings(); }
renderAll();
</script>
</body>
</html>
