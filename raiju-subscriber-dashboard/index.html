<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雷獣 登録者数ダッシュボード</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #dce2ea;
      --text: #18202a;
      --muted: #6b7480;
      --main: #1f6feb;
      --sub: #178a55;
      --warn: #b36b00;
      --danger: #b42318;
      --soft-main: #eaf2ff;
      --soft-sub: #e8f6ef;
      --soft-warn: #fff4db;
      --shadow: 0 10px 28px rgba(25, 35, 55, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 760;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      white-space: nowrap;
    }

    .status.ok {
      color: var(--sub);
      border-color: #b9dfca;
      background: var(--soft-sub);
    }

    .status.warn {
      color: var(--warn);
      border-color: #f2cf8b;
      background: var(--soft-warn);
    }

    .status.error {
      color: var(--danger);
      border-color: #f0b8b2;
      background: #fff0ef;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .metric-card,
    .chart-panel,
    .table-panel,
    .empty-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      min-height: 178px;
      padding: 16px;
      gap: 14px;
      overflow: hidden;
    }

    .metric-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .channel-mark {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    .metric-card.main .channel-mark {
      background: var(--main);
    }

    .metric-card.sub .channel-mark {
      background: var(--sub);
    }

    .metric-value {
      margin: 0;
      font-size: clamp(36px, 6vw, 60px);
      line-height: 1;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }

    .metric-value small {
      font-size: 16px;
      color: var(--muted);
      font-weight: 700;
    }

    .metric-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .fact {
      border-top: 1px solid var(--line);
      padding-top: 8px;
      min-width: 0;
    }

    .fact-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 2px;
    }

    .fact-value {
      font-size: 18px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .spark {
      width: 100%;
      height: 132px;
      align-self: center;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 12px;
    }

    .chart-panel,
    .table-panel {
      padding: 14px;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .panel-title {
      margin: 0;
      font-size: 14px;
      font-weight: 760;
    }

    .legend {
      display: flex;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend i {
      width: 12px;
      height: 3px;
      border-radius: 2px;
      display: inline-block;
    }

    #deltaChart {
      width: 100%;
      height: 250px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      padding: 9px 6px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 700;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty-state {
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 860px) {
      main {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        justify-content: flex-start;
      }

      .metric-grid,
      .chart-grid {
        grid-template-columns: 1fr;
      }

      .metric-card {
        grid-template-columns: 1fr;
      }

      .spark {
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar">
      <div>
        <h1>雷獣 登録者数</h1>
      </div>
      <div class="meta">
        <span class="status" id="freshness">読み込み中</span>
        <span class="status" id="latestDate">-</span>
        <span class="status" id="duplicateInfo">-</span>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="metric-grid">
        <article class="metric-card main">
          <div>
            <div class="metric-title">
              <span>メイン チャンネル</span>
              <span class="channel-mark"></span>
            </div>
            <p class="metric-value"><span id="mainCurrent">-</span><small> 人</small></p>
            <div class="metric-facts">
              <div class="fact">
                <div class="fact-label">前日差</div>
                <div class="fact-value" id="mainDelta">-</div>
              </div>
              <div class="fact">
                <div class="fact-label">7日平均</div>
                <div class="fact-value" id="mainAvg">-</div>
              </div>
            </div>
          </div>
          <svg class="spark" id="mainSpark" viewBox="0 0 180 132" role="img" aria-label="メイン登録者数推移"></svg>
        </article>

        <article class="metric-card sub">
          <div>
            <div class="metric-title">
              <span>サブ チャンネル</span>
              <span class="channel-mark"></span>
            </div>
            <p class="metric-value"><span id="subCurrent">-</span><small> 人</small></p>
            <div class="metric-facts">
              <div class="fact">
                <div class="fact-label">前日差</div>
                <div class="fact-value" id="subDelta">-</div>
              </div>
              <div class="fact">
                <div class="fact-label">7日平均</div>
                <div class="fact-value" id="subAvg">-</div>
              </div>
            </div>
          </div>
          <svg class="spark" id="subSpark" viewBox="0 0 180 132" role="img" aria-label="サブ登録者数推移"></svg>
        </article>
      </div>

      <div class="chart-grid">
        <section class="chart-panel">
          <div class="panel-head">
            <h2 class="panel-title">日次増加</h2>
            <div class="legend">
              <span><i style="background: var(--main)"></i>メイン</span>
              <span><i style="background: var(--sub)"></i>サブ</span>
            </div>
          </div>
          <svg id="deltaChart" viewBox="0 0 680 250" role="img" aria-label="日次増加グラフ"></svg>
        </section>

        <section class="table-panel">
          <div class="panel-head">
            <h2 class="panel-title">最近の記録</h2>
          </div>
          <table>
            <thead>
              <tr>
                <th>日付</th>
                <th>メイン</th>
                <th>サブ</th>
              </tr>
            </thead>
            <tbody id="recentRows"></tbody>
          </table>
        </section>
      </div>
    </section>

    <section id="emptyState" class="empty-state hidden">データを読み込めませんでした。</section>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHNvpb7d-azEp0dkGZ7dAfWAd4JzKefhNijwEdPJdM4gVoiHth4O8qHH2lS-Abv90epW7JGP66XI-2/pub?gid=1776448409&single=true&output=csv";

    const nf = new Intl.NumberFormat("ja-JP");
    const dateFmt = new Intl.DateTimeFormat("ja-JP", { month: "2-digit", day: "2-digit" });

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);
      return rows;
    }

    function parseDateCell(value) {
      const match = String(value || "").trim().match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
      if (!match) return null;
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      return {
        iso: `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
        label: `${year}/${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}`,
        date: new Date(year, month - 1, day)
      };
    }

    function normalizeRows(csvRows) {
      const dataRows = csvRows.slice(1);
      const byDate = new Map();
      let validCount = 0;

      dataRows.forEach((cells, index) => {
        const dateInfo = parseDateCell(cells[0]);
        const main = Number(String(cells[1] || "").replace(/,/g, ""));
        const sub = Number(String(cells[2] || "").replace(/,/g, ""));
        if (!dateInfo || !Number.isFinite(main) || !Number.isFinite(sub)) return;
        validCount += 1;
        byDate.set(dateInfo.iso, { ...dateInfo, main, sub, sourceRow: index + 2 });
      });

      return {
        rows: Array.from(byDate.values()).sort((a, b) => a.date - b.date),
        duplicateCount: Math.max(0, validCount - byDate.size),
        sourceCount: validCount
      };
    }

    function daysBetween(a, b) {
      return Math.max(1, Math.round((b.date - a.date) / 86400000));
    }

    function averagePerDay(rows, key, days) {
      if (rows.length < 2) return null;
      const latest = rows[rows.length - 1];
      const cutoff = new Date(latest.date);
      cutoff.setDate(cutoff.getDate() - days);
      const base = rows.filter(row => row.date <= cutoff).pop() || rows[0];
      const span = daysBetween(base, latest);
      return Math.round((latest[key] - base[key]) / span);
    }

    function previousDelta(rows, key) {
      if (rows.length < 2) return null;
      return rows[rows.length - 1][key] - rows[rows.length - 2][key];
    }

    function signed(value, suffix = "") {
      if (value === null || value === undefined || !Number.isFinite(value)) return "-";
      return `${value >= 0 ? "+" : ""}${nf.format(value)}${suffix}`;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function linePath(points) {
      return points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ");
    }

    function drawSpark(svg, rows, key, color) {
      const width = 180;
      const height = 132;
      const pad = { top: 14, right: 8, bottom: 18, left: 8 };
      const visible = rows.slice(-21);
      const values = visible.map(row => row[key]);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = Math.max(1, max - min);
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const points = visible.map((row, index) => ({
        x: pad.left + (visible.length === 1 ? plotW : (index / (visible.length - 1)) * plotW),
        y: pad.top + plotH - ((row[key] - min) / range) * plotH
      }));
      const fillPoints = [
        { x: points[0].x, y: pad.top + plotH },
        ...points,
        { x: points[points.length - 1].x, y: pad.top + plotH }
      ];

      svg.innerHTML = `
        <rect x="0" y="0" width="${width}" height="${height}" rx="8" fill="${color === "main" ? "#eaf2ff" : "#e8f6ef"}"></rect>
        <path d="${linePath(fillPoints)} Z" fill="${color === "main" ? "rgba(31,111,235,.14)" : "rgba(23,138,85,.14)"}"></path>
        <path d="${linePath(points)}" fill="none" stroke="${color === "main" ? "#1f6feb" : "#178a55"}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="${points[points.length - 1].x.toFixed(2)}" cy="${points[points.length - 1].y.toFixed(2)}" r="4" fill="${color === "main" ? "#1f6feb" : "#178a55"}"></circle>
        <text x="${pad.left}" y="${height - 5}" fill="#6b7480" font-size="10">${dateFmt.format(visible[0].date)}</text>
        <text x="${width - pad.right}" y="${height - 5}" text-anchor="end" fill="#6b7480" font-size="10">${dateFmt.format(visible[visible.length - 1].date)}</text>
      `;
    }

    function drawDeltaChart(svg, rows) {
      const width = 680;
      const height = 250;
      const pad = { top: 18, right: 20, bottom: 34, left: 48 };
      const visible = rows.slice(-14);
      const deltas = visible.slice(1).map((row, index) => ({
        date: row.date,
        label: dateFmt.format(row.date),
        main: row.main - visible[index].main,
        sub: row.sub - visible[index].sub
      }));

      if (!deltas.length) {
        svg.innerHTML = "";
        return;
      }

      const maxAbs = Math.max(1000, ...deltas.flatMap(row => [Math.abs(row.main), Math.abs(row.sub)]));
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const zeroY = pad.top + plotH / 2;
      const step = plotW / deltas.length;
      const barW = Math.min(16, Math.max(8, step * .28));

      const bars = deltas.map((row, index) => {
        const center = pad.left + step * index + step / 2;
        const makeBar = (value, x, color) => {
          const h = Math.abs(value) / maxAbs * (plotH / 2 - 8);
          const y = value >= 0 ? zeroY - h : zeroY;
          return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW}" height="${Math.max(2, h).toFixed(2)}" rx="3" fill="${color}"></rect>`;
        };
        const tick = index % Math.ceil(deltas.length / 5) === 0
          ? `<text x="${center.toFixed(2)}" y="${height - 10}" text-anchor="middle" fill="#6b7480" font-size="10">${row.label}</text>`
          : "";
        return `${makeBar(row.main, center - barW - 2, "#1f6feb")}${makeBar(row.sub, center + 2, "#178a55")}${tick}`;
      }).join("");

      svg.innerHTML = `
        <line x1="${pad.left}" y1="${zeroY}" x2="${width - pad.right}" y2="${zeroY}" stroke="#cfd7e3"></line>
        <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#dce2ea"></line>
        <text x="${pad.left - 8}" y="${pad.top + 4}" text-anchor="end" fill="#6b7480" font-size="10">+${nf.format(maxAbs)}</text>
        <text x="${pad.left - 8}" y="${zeroY + 4}" text-anchor="end" fill="#6b7480" font-size="10">0</text>
        <text x="${pad.left - 8}" y="${height - pad.bottom}" text-anchor="end" fill="#6b7480" font-size="10">-${nf.format(maxAbs)}</text>
        ${bars}
      `;
    }

    function renderTable(rows) {
      const body = document.getElementById("recentRows");
      body.innerHTML = rows.slice(-7).reverse().map(row => `
        <tr>
          <td>${row.label}</td>
          <td>${nf.format(row.main)}</td>
          <td>${nf.format(row.sub)}</td>
        </tr>
      `).join("");
    }

    function freshnessClass(latest) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const ageDays = Math.round((today - latest.date) / 86400000);
      if (ageDays <= 0) return { label: "本日更新済み", className: "ok" };
      if (ageDays === 1 && now.getHours() < 10) return { label: "前日分まで反映", className: "ok" };
      if (ageDays <= 1) return { label: "本日未更新", className: "warn" };
      return { label: `${ageDays}日未更新`, className: "error" };
    }

    function render(data) {
      const rows = data.rows;
      if (!rows.length) throw new Error("No rows");
      const latest = rows[rows.length - 1];
      const fresh = freshnessClass(latest);

      setText("mainCurrent", nf.format(latest.main));
      setText("subCurrent", nf.format(latest.sub));
      setText("mainDelta", signed(previousDelta(rows, "main"), " 人"));
      setText("subDelta", signed(previousDelta(rows, "sub"), " 人"));
      setText("mainAvg", signed(averagePerDay(rows, "main", 7), " /日"));
      setText("subAvg", signed(averagePerDay(rows, "sub", 7), " /日"));
      setText("latestDate", `最新: ${latest.label}`);
      setText("duplicateInfo", `重複除外: ${nf.format(data.duplicateCount)}行`);

      const freshness = document.getElementById("freshness");
      freshness.textContent = fresh.label;
      freshness.className = `status ${fresh.className}`;

      drawSpark(document.getElementById("mainSpark"), rows, "main", "main");
      drawSpark(document.getElementById("subSpark"), rows, "sub", "sub");
      drawDeltaChart(document.getElementById("deltaChart"), rows);
      renderTable(rows);

      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("emptyState").classList.add("hidden");
    }

    async function boot() {
      try {
        const response = await fetch(`${CSV_URL}&cacheBust=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`CSV request failed: ${response.status}`);
        const text = await response.text();
        render(normalizeRows(parseCsv(text)));
      } catch (error) {
        const state = document.getElementById("emptyState");
        state.textContent = `データを読み込めませんでした。${error.message}`;
        state.classList.remove("hidden");
        const freshness = document.getElementById("freshness");
        freshness.textContent = "読み込み失敗";
        freshness.className = "status error";
      }
    }

    boot();
  </script>
</body>
</html>
