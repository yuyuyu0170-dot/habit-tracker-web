<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雷獣 登録者数ダッシュボード</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #dce2ea;
      --text: #18202a;
      --muted: #6b7480;
      --main: #1f6feb;
      --sub: #178a55;
      --warn: #b36b00;
      --danger: #b42318;
      --soft-main: #eaf2ff;
      --soft-sub: #e8f6ef;
      --soft-warn: #fff4db;
      --shadow: 0 8px 22px rgba(25, 35, 55, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 10px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 760;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      white-space: nowrap;
    }

    .status.ok {
      color: var(--sub);
      border-color: #b9dfca;
      background: var(--soft-sub);
    }

    .status.warn {
      color: var(--warn);
      border-color: #f2cf8b;
      background: var(--soft-warn);
    }

    .status.error {
      color: var(--danger);
      border-color: #f0b8b2;
      background: #fff0ef;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric-card,
    .empty-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      min-height: 148px;
      padding: 12px;
      gap: 10px;
      overflow: hidden;
    }

    .metric-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .channel-mark {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    .metric-card.main .channel-mark {
      background: var(--main);
    }

    .metric-card.sub .channel-mark {
      background: var(--sub);
    }

    .metric-value {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }

    .metric-value small {
      font-size: 16px;
      color: var(--muted);
      font-weight: 700;
    }

    .spark {
      width: 100%;
      height: 124px;
      align-self: center;
    }

    .empty-state {
      padding: 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 860px) {
      main {
        padding: 8px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .meta {
        justify-content: flex-start;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .metric-card {
        grid-template-columns: 1fr;
      }

      .spark {
        height: 132px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="topbar">
      <div>
        <h1>雷獣 登録者数</h1>
      </div>
      <div class="meta">
        <span class="status" id="freshness">読み込み中</span>
        <span class="status" id="latestDate">-</span>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="metric-grid">
        <article class="metric-card main">
          <div>
            <div class="metric-title">
              <span>メイン チャンネル</span>
              <span class="channel-mark"></span>
            </div>
            <p class="metric-value"><span id="mainCurrent">-</span><small> 人</small></p>
          </div>
          <svg class="spark" id="mainSpark" viewBox="0 0 220 154" role="img" aria-label="メイン登録者数推移"></svg>
        </article>

        <article class="metric-card sub">
          <div>
            <div class="metric-title">
              <span>サブ チャンネル</span>
              <span class="channel-mark"></span>
            </div>
            <p class="metric-value"><span id="subCurrent">-</span><small> 人</small></p>
          </div>
          <svg class="spark" id="subSpark" viewBox="0 0 220 154" role="img" aria-label="サブ登録者数推移"></svg>
        </article>
      </div>
    </section>

    <section id="emptyState" class="empty-state hidden">データを読み込めませんでした。</section>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHNvpb7d-azEp0dkGZ7dAfWAd4JzKefhNijwEdPJdM4gVoiHth4O8qHH2lS-Abv90epW7JGP66XI-2/pub?gid=1776448409&single=true&output=csv";

    const nf = new Intl.NumberFormat("ja-JP");
    const dateFmt = new Intl.DateTimeFormat("ja-JP", { month: "2-digit", day: "2-digit" });

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && quoted && next === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i += 1;
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== "")) rows.push(row);
      return rows;
    }

    function parseDateCell(value) {
      const match = String(value || "").trim().match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
      if (!match) return null;
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      return {
        iso: `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`,
        label: `${year}/${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}`,
        date: new Date(year, month - 1, day)
      };
    }

    function normalizeRows(csvRows) {
      const dataRows = csvRows.slice(1);
      const byDate = new Map();
      let validCount = 0;

      dataRows.forEach((cells, index) => {
        const dateInfo = parseDateCell(cells[0]);
        const main = Number(String(cells[1] || "").replace(/,/g, ""));
        const sub = Number(String(cells[2] || "").replace(/,/g, ""));
        if (!dateInfo || !Number.isFinite(main) || !Number.isFinite(sub)) return;
        validCount += 1;
        byDate.set(dateInfo.iso, { ...dateInfo, main, sub, sourceRow: index + 2 });
      });

      return {
        rows: Array.from(byDate.values()).sort((a, b) => a.date - b.date),
        duplicateCount: Math.max(0, validCount - byDate.size),
        sourceCount: validCount
      };
    }

    function daysBetween(a, b) {
      return Math.max(1, Math.round((b.date - a.date) / 86400000));
    }

    function averagePerDay(rows, key, days) {
      if (rows.length < 2) return null;
      const latest = rows[rows.length - 1];
      const cutoff = new Date(latest.date);
      cutoff.setDate(cutoff.getDate() - days);
      const base = rows.filter(row => row.date <= cutoff).pop() || rows[0];
      const span = daysBetween(base, latest);
      return Math.round((latest[key] - base[key]) / span);
    }

    function totalForDays(rows, key, days) {
      if (rows.length < 2) return null;
      const latest = rows[rows.length - 1];
      const cutoff = new Date(latest.date);
      cutoff.setDate(cutoff.getDate() - days);
      const base = rows.filter(row => row.date <= cutoff).pop() || rows[0];
      return latest[key] - base[key];
    }

    function previousDelta(rows, key) {
      if (rows.length < 2) return null;
      return rows[rows.length - 1][key] - rows[rows.length - 2][key];
    }

    function signed(value, suffix = "") {
      if (value === null || value === undefined || !Number.isFinite(value)) return "-";
      return `${value >= 0 ? "+" : ""}${nf.format(value)}${suffix}`;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function linePath(points) {
      return points.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ");
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function nextMilestone(value) {
      const step = value >= 100000 ? 10000 : 1000;
      return Math.ceil((value + 1) / step) * step;
    }

    function tickValues(min, max) {
      if (min === max) return [min];
      return [max, Math.round((min + max) / 2), min];
    }

    function tickLabel(value) {
      return nf.format(Math.round(value / 1000) * 1000);
    }

    function drawSpark(svg, rows, key, color, deltaLabel, averageLabel, totalLabel) {
      const width = 220;
      const height = 154;
      const pad = { top: 34, right: 12, bottom: 18, left: 50 };
      const visible = rows.slice(-21);
      const values = visible.map(row => row[key]);
      const rawMin = Math.min(...values);
      const rawMax = Math.max(...values);
      const latest = visible[visible.length - 1];
      const milestone = nextMilestone(latest[key]);
      const includeMilestone = milestone - rawMax <= Math.max(1000, (rawMax - rawMin) * 2.5);
      const padding = Math.max(500, Math.round((rawMax - rawMin) * 0.12));
      const min = rawMin === rawMax ? rawMin - 1000 : rawMin - padding;
      const max = Math.max(rawMax + padding, includeMilestone ? milestone : rawMax);
      const range = Math.max(1, max - min);
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const points = visible.map((row, index) => ({
        x: pad.left + (visible.length === 1 ? plotW : (index / (visible.length - 1)) * plotW),
        y: pad.top + plotH - ((row[key] - min) / range) * plotH
      }));
      const pointByIso = new Map(points.map((point, index) => [visible[index].iso, point]));
      const fillPoints = [
        { x: points[0].x, y: pad.top + plotH },
        ...points,
        { x: points[points.length - 1].x, y: pad.top + plotH }
      ];
      const ticks = tickValues(min, max).map(value => ({
        value,
        y: pad.top + plotH - ((value - min) / range) * plotH
      }));
      const milestoneY = clamp(pad.top + plotH - ((milestone - min) / range) * plotH, pad.top + 2, pad.top + plotH);
      const gainCandidates = visible.map((row, index) => ({
        row,
        point: points[index],
        delta: index === 0 ? 0 : row[key] - visible[index - 1][key]
      })).filter(item => item.delta > 0);
      const gains = [];
      for (let i = gainCandidates.length - 1; i >= 0 && gains.length < 3; i -= 1) {
        const candidate = gainCandidates[i];
        if (gains.every(item => Math.abs(item.point.x - candidate.point.x) >= 38)) {
          gains.unshift(candidate);
        }
      }
      const latestPoint = pointByIso.get(latest.iso);
      const latestTagX = width - 88;
      const latestTagY = height - 38;
      const accent = color === "main" ? "#1f6feb" : "#178a55";
      const soft = color === "main" ? "#eaf2ff" : "#e8f6ef";
      const area = color === "main" ? "rgba(31,111,235,.14)" : "rgba(23,138,85,.14)";

      svg.innerHTML = `
        <rect x="0" y="0" width="${width}" height="${height}" rx="8" fill="${soft}"></rect>
        <text x="10" y="18" fill="#6b7480" font-size="10">前日 ${deltaLabel}</text>
        <text x="${width - 10}" y="18" text-anchor="end" fill="#6b7480" font-size="10">7日 ${averageLabel}/日</text>
        ${ticks.map(tick => `
          <line x1="${pad.left}" x2="${width - pad.right}" y1="${tick.y.toFixed(2)}" y2="${tick.y.toFixed(2)}" stroke="#cfd7e2" stroke-width="1" opacity=".8"></line>
          <text x="9" y="${(tick.y + 3).toFixed(2)}" fill="#6b7480" font-size="9">${tickLabel(tick.value)}</text>
        `).join("")}
        <line x1="${pad.left}" x2="${width - pad.right}" y1="${milestoneY.toFixed(2)}" y2="${milestoneY.toFixed(2)}" stroke="${accent}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".75"></line>
        <text x="${width - 10}" y="${(milestoneY - 4).toFixed(2)}" text-anchor="end" fill="${accent}" font-size="9">次 ${nf.format(milestone)}まであと${nf.format(milestone - latest[key])}</text>
        <path d="${linePath(fillPoints)} Z" fill="${area}"></path>
        <path d="${linePath(points)}" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        ${gains.map(item => {
          const labelX = clamp(item.point.x, pad.left + 18, width - 18);
          const labelY = clamp(item.point.y - 9, pad.top + 22, height - 20);
          return `
            <rect x="${(labelX - 17).toFixed(2)}" y="${(labelY - 11).toFixed(2)}" width="34" height="14" rx="7" fill="#ffffff" opacity=".92"></rect>
            <text x="${labelX.toFixed(2)}" y="${labelY.toFixed(2)}" text-anchor="middle" fill="${accent}" font-size="9" font-weight="700">+${nf.format(item.delta)}</text>
          `;
        }).join("")}
        <circle cx="${latestPoint.x.toFixed(2)}" cy="${latestPoint.y.toFixed(2)}" r="4" fill="${accent}"></circle>
        <rect x="${latestTagX.toFixed(2)}" y="${latestTagY.toFixed(2)}" width="78" height="30" rx="7" fill="#ffffff" opacity=".94"></rect>
        <text x="${(latestTagX + 39).toFixed(2)}" y="${(latestTagY + 12).toFixed(2)}" text-anchor="middle" fill="#18202a" font-size="10" font-weight="800">${nf.format(latest[key])}</text>
        <text x="${(latestTagX + 39).toFixed(2)}" y="${(latestTagY + 24).toFixed(2)}" text-anchor="middle" fill="#6b7480" font-size="9">7日 ${totalLabel}</text>
      `;
    }

    function freshnessClass(latest) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const ageDays = Math.round((today - latest.date) / 86400000);
      if (ageDays <= 0) return { label: "本日更新済み", className: "ok" };
      if (ageDays === 1 && now.getHours() < 10) return { label: "前日分まで反映", className: "ok" };
      if (ageDays <= 1) return { label: "本日未更新", className: "warn" };
      return { label: `${ageDays}日未更新`, className: "error" };
    }

    function render(data) {
      const rows = data.rows;
      if (!rows.length) throw new Error("No rows");
      const latest = rows[rows.length - 1];
      const fresh = freshnessClass(latest);
      const mainDelta = previousDelta(rows, "main");
      const subDelta = previousDelta(rows, "sub");
      const mainAverage = averagePerDay(rows, "main", 7);
      const subAverage = averagePerDay(rows, "sub", 7);
      const mainTotal = totalForDays(rows, "main", 7);
      const subTotal = totalForDays(rows, "sub", 7);

      setText("mainCurrent", nf.format(latest.main));
      setText("subCurrent", nf.format(latest.sub));
      setText("latestDate", `最新: ${latest.label}`);

      const freshness = document.getElementById("freshness");
      freshness.textContent = fresh.label;
      freshness.className = `status ${fresh.className}`;

      drawSpark(document.getElementById("mainSpark"), rows, "main", "main", signed(mainDelta), signed(mainAverage), signed(mainTotal));
      drawSpark(document.getElementById("subSpark"), rows, "sub", "sub", signed(subDelta), signed(subAverage), signed(subTotal));

      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("emptyState").classList.add("hidden");
    }

    async function boot() {
      try {
        const response = await fetch(`${CSV_URL}&cacheBust=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`CSV request failed: ${response.status}`);
        const text = await response.text();
        render(normalizeRows(parseCsv(text)));
      } catch (error) {
        const state = document.getElementById("emptyState");
        state.textContent = `データを読み込めませんでした。${error.message}`;
        state.classList.remove("hidden");
        const freshness = document.getElementById("freshness");
        freshness.textContent = "読み込み失敗";
        freshness.className = "status error";
      }
    }

    boot();
  </script>
</body>
</html>
